<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Elegant Jewelry</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      background: #fff;
    }

    /* ================= SLIDER ================= */
   .slider { 
    width: 100%; height: 100vh; 
    background-image: url("Photos/back1.jpg"); 
    background-size: contain; background-position: center; 
    position: relative; transition: background-image 0.5s ease-in-out; } 
    /* Light overlay */ .overlay { position: absolute; 
        top: 0; left: 0; width: 100%; height: 100%;
     background: rgba(255, 255, 255, 0.6); }

    /* ================= CONTENT ================= */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
      padding: 20px;
    }
.content h1 {
  font-size: 40px;
  font-weight: 700; /* bold */
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #fff; /* white text */
  text-shadow:
    1px 1px 2px rgba(0,0,0,0.5),  /* subtle dark shadow for readability */
    0 4px 10px rgba(184,155,94,0.3); /* soft golden glow */
  -webkit-text-stroke: 0.5px rgba(184,155,94,0.6); /* thin outline for luxury look */
  margin-bottom: 18px;
  transition: transform 0.35s ease, text-shadow 0.35s ease;
}

.content h1:hover {
  transform: translateY(-2px);
  text-shadow:
    1px 1px 3px rgba(0,0,0,0.25),
    0 10px 25px rgba(184,155,94,0.45); /* hover glow */
}

/* ================= SUBTITLE ================= */
.content p {
  font-size: 20px;
  font-weight: 700; /* bold */
  color: #fff; /* white text */
  letter-spacing: 0.8px;
  margin-bottom: 38px;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.3); /* subtle shadow for readability */
  transition: color 0.3s ease, transform 0.3s ease, text-shadow 0.3s ease;
}

.content p:hover {
  transform: translateY(-1px);
  text-shadow: 1px 1px 5px rgba(0,0,0,0.4); /* enhance shadow on hover */
}
.content button {
 padding:15px 40px;font-size:18px;font-weight:bold;background:linear-gradient(135deg,#20c997,#008080);color:#fff;border:none;border-radius:40px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 10px 25px rgba(32,201,151,0.35);transition: all 0.4s ease;}

.content button:hover {
background:#006666;transform:translateY(-3px);box-shadow:0 15px 35px rgba(0,0,0,0.35);
}
    /* Arrow animation */
    .content button .arrow {
      margin-left: 10px;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .content button:hover .arrow {
      transform: translateX(10px);
    }

    /* Shine effect */
    .content button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255,255,255,0.3);
      transform: skewX(-25deg);
      transition: 0.6s;
    }

    .content button:hover::before {
      left: 120%;
    }

    /* Shine effect (always running) */
.content button::before {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.3);
  transform: skewX(-25deg);
  animation: shine 2s linear infinite; /* added animation */
}

@keyframes shine {
  0% {
    left: -100%;
  }
  100% {
    left: 120%;
  }
}


/* Slide in from left */
@keyframes slideIn {
  0% {
    opacity: 0;
    transform: translateX(-50px);
  }
  100% {
    opacity: 1;
    transform: translateX(0);
  }
}

/* Slide in from bottom */
@keyframes slideUp {
  0% {
    opacity: 0;
    transform: translateY(50px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Apply animations to elements */
.content h1 {
  animation: slideIn 1s ease-out forwards;
}

.content p {
  animation: slideIn 1s ease-out forwards;
  animation-delay: 0.3s; /* appear after h1 */
}

.content button {
  animation: slideUp 1s ease-out forwards;
  animation-delay: 0.6s; /* appear after text */
}

  </style>
</head>

<body>

  <!-- ================= HTML ================= -->
  <div class="slider">
    <div class="overlay"></div>

    <div class="content">
      <h1>Luxury That Speaks Without Words</h1>
<p>Fine jewelry crafted for moments that matter</p>
      <button onclick="enterSite()">
        Explore Collection <span class="arrow">→</span>
      </button>
    </div>
  </div>

  <!-- ================= JS ================= -->
<script>
    let images = [
      "Photos/back1.jpg",
      "Photos/back2.jpg",
      "Photos/back3.jpg",
      "Photos/back4.jpg"
    ];

    let current = 0;
    let slider = document.querySelector(".slider");

    setInterval(() => {
      current = (current + 1) % images.length;
      slider.style.backgroundImage = `url(${images[current]})`;
    }, 2000);

    function enterSite() {
      window.location.href = "home.html";
    }
  </script>
</body>
</html>
